# Question formula library — Phase 6c.
#
# Each formula: a short name, a one-line explanation, and a scaffolded `stem` with
# blanks (use ____ for blanks). Selecting a formula drops the stem into the brainstorm.
# `genres` optionally narrows which genres it best suits. Fill `explanation`/`stem`;
# set state per the content/README.md policy.

groups:
  observation:
    - id: count-or-list
      name: "Count or list"
      explanation: "Pick a word or idea that recurs and have the group count or list every instance. Repetition is the author raising his voice."
      stem: "List every place ____ appears in verses ____. What is the author pressing by repeating it?"
      genres: []
      state: uncited
      source:
      flag: "Standard inductive-study observation move; fuller treatment likely in Fee & Stuart or Sweatman, Writing a Small Group Study (not held). Project's own phrasing."
    - id: track-the-subject
      name: "Track the subject"
      explanation: "Follow one person or thing through the passage and watch what it does and what is done to it. The grammar often carries the point."
      stem: "Follow ____ through the passage. What does ____ do, and what is done to ____?"
      genres: []
      state: uncited
      source:
      flag: "Standard inductive-study observation move; fuller treatment likely in Fee & Stuart or Sweatman, Writing a Small Group Study (not held). Project's own phrasing."
    - id: compare
      name: "Compare"
      explanation: "Set two people, moments, or ideas side by side and ask what the difference teaches. Authors often make a point by contrast."
      stem: "Compare ____ with ____. What is different, and why does the difference matter?"
      genres: []
      state: uncited
      source:
      flag: "Standard inductive-study observation move; fuller treatment likely in Fee & Stuart or Sweatman, Writing a Small Group Study (not held). Project's own phrasing."
    - id: odd-grammar
      name: "Odd grammar"
      explanation: "Notice a word choice or construction that seems odd, abrupt, or overworked, and ask why it was written that way."
      stem: "Why does the author say ____ rather than the plainer way of putting it? What does that wording add?"
      genres: []
      state: uncited
      source:
      flag: "Standard inductive-study observation move; fuller treatment likely in Fee & Stuart or Sweatman, Writing a Small Group Study (not held). Project's own phrasing."
    - id: structure
      name: "Structure"
      explanation: "Ask how the passage is built: where it turns, what frames what, what sits at its centre or its ends."
      stem: "How is this passage built? What does its shape, from ____ to ____, show?"
      genres: []
      state: uncited
      source:
      flag: "Standard inductive-study observation move; fuller treatment likely in Fee & Stuart or Sweatman, Writing a Small Group Study (not held). Project's own phrasing."
    - id: absence
      name: "Absence"
      explanation: "Notice what is missing, unsaid, or left unanswered. What an author leaves out can be as loud as what he includes."
      stem: "What would you expect to be here that is not? What does the silence about ____ tell us?"
      genres: []
      state: uncited
      source:
      flag: "Standard inductive-study observation move; fuller treatment likely in Fee & Stuart or Sweatman, Writing a Small Group Study (not held). Project's own phrasing."
  meaning:
    - id: logic-and-connection
      name: "Logic and connection"
      explanation: "Ask what a connecting word is doing. A 'therefore', 'so that', 'but', or 'because' tells you how one part depends on another."
      stem: "What is the '____' in verse ____ joining? What follows from what?"
      genres: []
      state: uncited
      source:
      flag: "Standard meaning move (logical connectives); fuller treatment likely in Fee & Stuart or Sweatman (not held). Project's own phrasing."
    - id: cause-and-purpose
      name: "Cause and purpose"
      explanation: "Separate why something happened (cause) from what it was for (purpose). The text often gives one and assumes the other."
      stem: "According to the passage, why does ____ happen, and what is it meant to achieve?"
      genres: []
      state: uncited
      source:
      flag: "Standard inductive/meaning move; fuller treatment likely in Fee & Stuart or Sweatman, Writing a Small Group Study (not held). Project's own phrasing."
    - id: proportion-emphasis
      name: "Proportion and emphasis"
      explanation: "Notice how much space the author gives each thing. Where he lingers, and where he hurries, shows what he is emphasising."
      stem: "Why does the author spend so long on ____ and so little on ____? What does the proportion tell us?"
      genres: []
      state: uncited
      source:
      flag: "Standard inductive/meaning move; fuller treatment likely in Fee & Stuart or Sweatman, Writing a Small Group Study (not held). Project's own phrasing."
    - id: counterfactual
      name: "Counterfactual"
      explanation: "Ask what would change if a detail were removed or reversed. Taking something away shows what it was doing."
      stem: "What would be different if ____ were not here, or were the other way round?"
      genres: []
      state: uncited
      source:
      flag: "Standard inductive/meaning move; fuller treatment likely in Fee & Stuart or Sweatman, Writing a Small Group Study (not held). Project's own phrasing."
    - id: summary
      name: "Summary"
      explanation: "Have the group put the passage, or a section of it, in a sentence of their own. Summarising forces them to decide what matters most."
      stem: "In one sentence of your own, what are verses ____ mainly saying?"
      genres: []
      state: uncited
      source:
      flag: "Summarise-in-a-sentence move; loose cousin of ACS sec. ii (held; summarise in a sentence or two, ships uncited per owner) and the 'big idea' family (Robinson, Biblical Preaching, not held). Project's own phrasing."
    - id: original-hearing
      name: "Original hearing"
      explanation: "Ask how the first hearers would have taken this, before you ask what it means for us. Meaning runs through them to us."
      stem: "How would the first hearers have heard verse ____? What would have landed differently for them than for us?"
      genres: []
      state: uncited
      source:
      flag: "Original-audience / historical-context meaning move; fuller treatment likely in Fee & Stuart, How to Read the Bible for All Its Worth (not held). Project's own phrasing."
    - id: theology-and-christ
      name: "Theology and Christ"
      explanation: "Ask what the passage shows about God, and how it points forward to Christ. If the link is faint, name that rather than forcing it. This is the meaning question that keeps a study from stopping at good advice."
      stem: "What does ____ in this passage show us about God, and how does it point forward to Christ?"
      genres: []
      state: uncited
      source:
      flag: "The moralism concern and the Christ-connection method belong to Phase 5 (see p5.christ-route, which cites Goldsworthy). Project's own meaning-question generator; ships uncited this session."
    - id: tension-resolution
      name: "Tension and resolution"
      explanation: "Find the problem or tension the passage sets up, and where or whether it resolves it. The movement from one to the other is often the point."
      stem: "What tension does this passage set up? Is it resolved by verse ____, and if so, how?"
      genres: []
      state: uncited
      source:
      flag: "Standard inductive/meaning move; fuller treatment likely in Fee & Stuart or Sweatman, Writing a Small Group Study (not held). Project's own phrasing."
  context:
    # The spec references "the context formats" without enumerating them; these two
    # are the project's own choice (see each item's flag).
    - id: where-in-the-book
      name: "Where in the book"
      explanation: "Place the passage in the flow of the whole book: what has led here, and where it is heading."
      stem: "Where does this passage sit in the whole of ____? What has led up to it, and where is it heading?"
      genres: []
      state: uncited
      source:
      flag: "The spec names 'the context formats' without listing them; these two are the project's own choice. If Fee & Stuart, How to Read the Bible for All Its Worth (historical/literary context) or Sweatman become available, check for a standard set and reconcile."
    - id: whats-just-happened
      name: "What's just happened"
      explanation: "Look at the verses immediately before, so the group begins already knowing what has just happened."
      stem: "What happens in the verses right before ____, and how does it set up what we are about to read?"
      genres: []
      state: uncited
      source:
      flag: "The spec names 'the context formats' without listing them; these two are the project's own choice. If Fee & Stuart, How to Read the Bible for All Its Worth (historical/literary context) or Sweatman become available, check for a standard set and reconcile."
  application:
    - id: hunt-purpose-clauses
      name: "Hunt for purpose clauses"
      explanation: "Look for the author's own 'so that' or 'in order that'. Where he states the purpose of what he wrote, the application is already half made."
      stem: "What 'so that' or purpose does verse ____ give? What does that ask of us today?"
      genres: []
      state: uncited
      source:
      flag: "Purpose-clause application move; fuller treatment likely in Sweatman or an inductive-method source (not held). Project's own phrasing."
    - id: book-stated-purpose
      name: "Use the book's stated purpose"
      explanation: "Many books state somewhere why they were written. Find that stated aim, then read today's passage in light of it."
      stem: "What has ____ (the book) told us it is for? How does today's passage serve that aim in the way we live?"
      genres: []
      state: uncited
      source:
      flag: "Reading in light of the book's stated purpose; standard evangelical hermeneutics (Fee & Stuart, not held). Project's own phrasing."
    - id: locate-the-pressure
      name: "Locate the pressure"
      explanation: "Find where the passage presses on real life, often a fear it answers, a false confidence it unsettles, or a comfort it gives. Application lands where the pressure is."
      stem: "What pressure does this passage put on ____? What fear or false confidence does it speak to?"
      genres: []
      state: uncited
      source:
      flag: "Resembles Bryan Chapell's Fallen Condition Focus (Christ-Centered Preaching, not held); see also stuck-helpers 'what-is-it-against'. Ships uncited; if Chapell is obtained, check whether to cite or reword."
    - id: invert-the-indicative
      name: "Invert the indicative"
      explanation: "Turn a statement of what God has done into a question about living as if it were true. The indicative implies an imperative."
      stem: "The passage says ____ is true. If we really believed it, what would change this week?"
      genres: []
      state: uncited
      source:
      flag: "The indicative-imperative logic is a broad Reformed staple (Ridderbos, Bavinck; not held). The related 'gospel before law' point is Goldsworthy (Preaching the Whole Bible, intro p. xiv), verified in an earlier session, not this one. Project's own application generator; ships uncited."
