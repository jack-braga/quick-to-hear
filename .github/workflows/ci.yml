name: CI

on:
  # PRs cover feature branches; push covers main (post-merge). Avoids the double
  # run you'd get from triggering on every branch push AND its PR.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # Notify on CI failure (matches the deploy workflow's ntfy channel)
      - if: failure()
        run: curl -d "❌ Quick to Hear CI FAILED on ${{ github.ref_name }} (${{ github.sha }})" ntfy.sh/jsb-gh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E (Playwright)
        run: npm run test:e2e
      - if: failure()
        run: curl -d "❌ Quick to Hear E2E FAILED on ${{ github.ref_name }} (${{ github.sha }})" ntfy.sh/jsb-gh
