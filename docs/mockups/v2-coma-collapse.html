<!doctype html>
<html lang="en" data-theme="day">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quick to Hear — COMA clutter / collapsible headings (mockup)</title>
    <style>
      :root {
        --font-scripture: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
        --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --font-mono: 'SF Mono', 'JetBrains Mono', 'Menlo', 'Consolas', ui-monospace, monospace;
        --desk: #e7e4db; --leaf: #fbf9f2; --panel: #f2efe6;
        --ink: #1d1b17; --ink-soft: #77726a; --ink-faint: #a49e92; --line: #e2ddd0;
        --lapis: #28468a; --lapis-ink: #17305f; --lapis-wash: rgba(40,70,138,0.14); --lapis-edge: rgba(40,70,138,0.34);
        --amber-ink: #8a6a16; --amber-edge: rgba(185,138,30,0.42);
        --moss-ink: #3c5330;
        --shadow: 0 1px 2px rgba(30,27,20,0.05), 0 10px 26px -12px rgba(30,27,20,0.2);
        --radius: 10px;
      }
      :root[data-theme='night'] {
        --desk: #23252c; --leaf: #2b2e37; --panel: #333743;
        --ink: #e8e4da; --ink-soft: #a49f94; --ink-faint: #746f65; --line: #3c414c;
        --lapis: #90b0ef; --lapis-ink: #c6d6f8; --lapis-wash: rgba(144,176,239,0.2); --lapis-edge: rgba(144,176,239,0.42);
        --amber-ink: #e2c87c; --amber-edge: rgba(221,187,97,0.44);
        --moss-ink: #bcd6a3;
        --shadow: 0 1px 2px rgba(0,0,0,0.32), 0 14px 30px -14px rgba(0,0,0,0.5);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; font-family: var(--font-ui); background: var(--desk); color: var(--ink); -webkit-font-smoothing: antialiased; line-height: 1.5; }
      button, textarea { font-family: inherit; }
      button { cursor: pointer; }
      .app { height: 100vh; display: grid; grid-template-rows: auto 1fr; }
      .controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 9px 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
      .lbl { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .13em; color: var(--ink-faint); }
      .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
      .seg button { border: none; background: var(--leaf); color: var(--ink-soft); font-size: 12px; padding: 5px 11px; }
      .seg button + button { border-left: 1px solid var(--line); }
      .seg button.on { background: var(--lapis); color: #fff; }
      :root[data-theme='night'] .seg button.on { color: #16181d; }
      .desc { flex: 1 1 340px; min-width: 260px; font-size: 11.5px; color: var(--ink-soft); }
      .desc b { color: var(--ink); }
      .toggle { border: 1px solid var(--line); background: var(--leaf); color: var(--ink-soft); width: 30px; height: 30px; border-radius: 8px; }

      /* just the panel, centred, so the focus is the COMA list */
      .stage { display: grid; place-items: start center; overflow-y: auto; padding: 22px; }
      .panel { width: 380px; background: color-mix(in srgb, var(--desk) 55%, var(--leaf)); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
      .pbody { padding: 12px 14px 16px; }
      .phead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
      .phead .t { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .16em; color: var(--ink-faint); }
      .chips { display: flex; gap: 5px; margin-bottom: 10px; }
      .chip { font-family: var(--font-mono); font-size: 10.5px; border: 1px solid var(--lapis-edge); background: var(--lapis-wash); color: var(--lapis-ink); border-radius: 999px; padding: 3px 9px; }

      /* heading (collapsible) */
      .hgroup { border-top: 1px solid var(--line); }
      .hgroup:first-of-type { border-top: none; }
      .hbar { width: 100%; display: flex; align-items: center; gap: 8px; background: none; border: none; padding: 9px 2px; text-align: left; }
      .caret { font-size: 9px; color: var(--ink-faint); width: 10px; transition: transform .12s; }
      .hgroup.open .caret { transform: rotate(90deg); }
      .hname { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .13em; color: var(--lapis-ink); }
      .hmeta { margin-left: auto; font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-faint); }
      .hmeta .ans { color: var(--moss-ink); }
      .hbody { display: none; padding: 0 0 8px; }
      .hgroup.open .hbody { display: block; }

      .prow { display: flex; align-items: flex-start; gap: 8px; padding: 5px 8px; border-radius: 8px; font-size: 12.5px; color: var(--ink-soft); }
      .prow:hover { background: var(--leaf); }
      .gtag { margin-top: 1px; shrink: 0; font-family: var(--font-mono); font-size: 8.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-faint); background: var(--panel); border-radius: 4px; padding: 1px 5px; white-space: nowrap; }
      .prow .txt { flex: 1; line-height: 1.4; }
      .ans-btn { font-family: var(--font-mono); font-size: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft); border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
      .ans-btn:hover { border-color: var(--lapis-edge); color: var(--ink); }
      .card { margin: 4px 0 6px; background: var(--leaf); border: 1px solid var(--line); border-left: 3px solid var(--lapis-edge); border-radius: 9px; padding: 8px 10px; }
      .card .top { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
      .anchor { font-family: var(--font-mono); font-size: 10px; color: var(--lapis-ink); background: var(--lapis-wash); border-radius: 5px; padding: 1px 6px; }
      .card .a { font-size: 12.5px; color: var(--ink); }
      .more { font-family: var(--font-mono); font-size: 10px; color: var(--lapis-ink); background: none; border: none; padding: 4px 8px; }
      .more:hover { text-decoration: underline; }
      .att { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; font-size: 9.5px; font-style: italic; color: var(--ink-faint); }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="controls">
        <span class="lbl">Reduce COMA clutter</span>
        <div class="seg" id="seg">
          <button data-m="collapse" class="on">A · Collapsible headings</button>
          <button data-m="accordion">B · Accordion (one open)</button>
          <button data-m="answered">C · Answered-first</button>
        </div>
        <p class="desc" id="desc"></p>
        <button class="toggle" id="themeBtn" title="Day / night">☾</button>
      </div>
      <div class="stage">
        <div class="panel">
          <div class="pbody">
            <div class="phead"><span class="t">COMA — work the text</span></div>
            <div class="chips"><span class="chip">All</span><span class="chip">Gospels</span><span class="chip">Poetry</span></div>
            <div id="list"></div>
            <p class="att">COMA questions from David Helm, One-to-One Bible Reading (Matthias Media &amp; Holy Trinity Church, 2011), used by permission.</p>
          </div>
        </div>
      </div>
    </div>

    <script>
      const root = document.documentElement;
      document.getElementById('themeBtn').addEventListener('click', () => {
        const n = root.getAttribute('data-theme') === 'night';
        root.setAttribute('data-theme', n ? 'day' : 'night');
        document.getElementById('themeBtn').textContent = n ? '☾' : '☀';
      });

      // heading → prompts (g = genre tag). One prompt is answered (has a card).
      const GROUPS = [
        { key: 'Context', prompts: [
          { g: 'Gospels', t: 'What has happened just prior to this section?' },
          { g: 'Gospels', t: 'What has happened so far in the narrative — major events, characters, themes?' },
          { g: 'Poetry', t: 'Are there clues about the circumstances in which the passage was written?' },
        ]},
        { key: 'Observation', prompts: [
          { g: 'Gospels', t: 'What do you learn about the main characters? How does the author describe them?', answer: 'Mary is a lowly servant God chooses — the reversal starts with her.' },
          { g: 'Gospels', t: 'Is there a conflict or high point in the passage?' },
          { g: 'Poetry', t: 'What images and repetitions carry the weight? What is paired against what?' },
          { g: 'Poetry', t: 'Where does the poem turn?' },
        ]},
        { key: 'Meaning', prompts: [
          { g: 'Gospels', t: 'What does the passage reveal about who Jesus is, and what he came to do?' },
          { g: 'Poetry', t: 'How could you sum up the meaning of this passage in your own words?' },
        ]},
        { key: 'Application', prompts: [
          { g: 'Gospels', t: 'Is there some attitude you need to change?' },
          { g: 'Poetry', t: 'What does this passage lead you to pray?' },
        ]},
      ];

      const promptHTML = (p) => p.answer
        ? `<div class="card"><div class="top"><span class="anchor">Luke 1:48</span><span class="gtag">✓ ${p.g}</span></div><div class="a">${p.answer}</div></div>`
        : `<div class="prow"><span class="gtag">${p.g}</span><span class="txt">${p.t}</span><button class="ans-btn">✎ Answer</button></div>`;

      function counts(g) {
        const ans = g.prompts.filter((p) => p.answer).length;
        return { n: g.prompts.length, ans };
      }

      function render(model) {
        const list = document.getElementById('list');
        if (model === 'answered') {
          // answered cards up top per heading; the rest folded into "＋ N more"
          list.innerHTML = GROUPS.map((g) => {
            const answered = g.prompts.filter((p) => p.answer);
            const rest = g.prompts.filter((p) => !p.answer);
            return `<div class="hgroup open"><button class="hbar"><span class="hname">${g.key}</span>
              <span class="hmeta">${answered.length ? `<span class="ans">${answered.length} answered</span> · ` : ''}${rest.length} to answer</span></button>
              <div class="hbody">${answered.map(promptHTML).join('')}${rest.length ? `<button class="more">＋ ${rest.length} ${g.key.toLowerCase()} prompt${rest.length>1?'s':''} to answer…</button>` : ''}</div></div>`;
          }).join('');
          return;
        }
        // collapse / accordion: heading bar with a count; body shows all prompts when open
        list.innerHTML = GROUPS.map((g, i) => {
          const c = counts(g);
          const open = model === 'accordion' ? i === 1 : (i === 0 || i === 1); // demo: some open
          return `<div class="hgroup ${open ? 'open' : ''}" data-i="${i}"><button class="hbar" data-h="${i}"><span class="caret">▶</span><span class="hname">${g.key}</span>
            <span class="hmeta">${c.ans ? `<span class="ans">${c.ans}✓</span> · ` : ''}${c.n} prompt${c.n>1?'s':''}</span></button>
            <div class="hbody">${g.prompts.map(promptHTML).join('')}</div></div>`;
        }).join('');
        list.querySelectorAll('[data-h]').forEach((b) => b.addEventListener('click', () => {
          const grp = b.closest('.hgroup');
          if (model === 'accordion') list.querySelectorAll('.hgroup').forEach((x) => { if (x !== grp) x.classList.remove('open'); });
          grp.classList.toggle('open');
        }));
      }

      const DESC = {
        collapse: '<b>A · Collapsible headings.</b> Each Context/Observation/… heading collapses; the bar shows a <b>count</b> (and answered ✓). Click to expand. Open several at once. Fewest surprises.',
        accordion: '<b>B · Accordion.</b> Same, but only <b>one heading open at a time</b> — you focus on one COMA category, the rest stay one-liners. Calmest, but more clicking.',
        answered: '<b>C · Answered-first.</b> Your <b>answers show</b> under each heading; the unanswered prompts fold into a quiet "＋ N to answer…". Keeps your work front-and-centre, prompts on demand.',
      };
      let model = 'collapse';
      function apply() {
        document.getElementById('desc').innerHTML = DESC[model];
        for (const b of document.querySelectorAll('#seg button')) b.classList.toggle('on', b.dataset.m === model);
        render(model);
      }
      document.querySelectorAll('#seg button').forEach((b) => b.addEventListener('click', () => { model = b.dataset.m; apply(); }));
      apply();
    </script>
  </body>
</html>
