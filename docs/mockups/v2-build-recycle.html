<!doctype html>
<html lang="en" data-theme="day">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quick to Hear — Build recycle-forward options (mockup)</title>
    <style>
      :root {
        --font-scripture: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
        --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --font-mono: 'SF Mono', 'JetBrains Mono', 'Menlo', 'Consolas', ui-monospace, monospace;
        --desk: #e7e4db; --leaf: #fbf9f2; --panel: #f2efe6;
        --ink: #1d1b17; --ink-soft: #77726a; --ink-faint: #a49e92; --line: #e2ddd0;
        --lapis: #28468a; --lapis-ink: #17305f; --lapis-wash: rgba(40,70,138,0.12); --lapis-edge: rgba(40,70,138,0.32);
        --amber-wash: rgba(185,138,30,0.16); --amber-ink: #8a6a16; --amber-edge: rgba(185,138,30,0.4);
        --rubric: #a6321e; --rubric-wash: rgba(166,50,30,0.13); --rubric-edge: rgba(166,50,30,0.35);
        --shadow: 0 1px 2px rgba(30,27,20,0.05), 0 10px 26px -12px rgba(30,27,20,0.2);
        --radius: 10px;
      }
      :root[data-theme='night'] {
        --desk: #23252c; --leaf: #2b2e37; --panel: #333743;
        --ink: #e8e4da; --ink-soft: #a49f94; --ink-faint: #746f65; --line: #3c414c;
        --lapis: #90b0ef; --lapis-ink: #c6d6f8; --lapis-wash: rgba(144,176,239,0.16); --lapis-edge: rgba(144,176,239,0.38);
        --amber-wash: rgba(221,187,97,0.17); --amber-ink: #e2c87c; --amber-edge: rgba(221,187,97,0.42);
        --rubric: #e2805f; --rubric-wash: rgba(226,128,95,0.16); --rubric-edge: rgba(226,128,95,0.4);
        --shadow: 0 1px 2px rgba(0,0,0,0.32), 0 14px 30px -14px rgba(0,0,0,0.5);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; font-family: var(--font-ui); background: var(--desk); color: var(--ink); -webkit-font-smoothing: antialiased; line-height: 1.5; }
      button { font-family: inherit; cursor: pointer; }
      .app { height: 100vh; display: grid; grid-template-rows: auto auto 1fr; }

      .controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 9px 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
      .lbl { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .13em; color: var(--ink-faint); }
      .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
      .seg button { border: none; background: var(--leaf); color: var(--ink-soft); font-size: 12px; padding: 5px 11px; }
      .seg button + button { border-left: 1px solid var(--line); }
      .seg button.on { background: var(--lapis); color: #fff; }
      :root[data-theme='night'] .seg button.on { color: #16181d; }
      .desc { flex: 1 1 320px; min-width: 240px; font-size: 11.5px; color: var(--ink-soft); }
      .desc b { color: var(--ink); }
      .toggle { border: 1px solid var(--line); background: var(--leaf); color: var(--ink-soft); width: 30px; height: 30px; border-radius: 8px; }

      .topbar { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 18px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--desk) 82%, var(--leaf)); }
      .brand { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em; color: var(--ink-faint); text-transform: uppercase; }
      .ref { font-family: var(--font-scripture); font-size: 17px; }
      .grow { flex: 1; }
      .pill { font-family: var(--font-mono); font-size: 10px; color: var(--lapis-ink); background: var(--lapis-wash); border: 1px solid var(--lapis-edge); border-radius: 999px; padding: 2px 8px; }

      .work { display: grid; grid-template-columns: minmax(0,1fr) 400px; overflow: hidden; }
      .main { overflow-y: auto; padding: 20px 24px 50px; }
      .colhead { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .16em; color: var(--ink-faint); margin: 0 2px 12px; display: flex; justify-content: space-between; }
      .maxw { max-width: 40rem; }

      /* running-order question rows */
      .qrow { display: flex; gap: 10px; align-items: flex-start; background: var(--leaf); border: 1px solid var(--line); border-left: 3px solid var(--amber-edge); border-radius: var(--radius); padding: 10px 12px; box-shadow: var(--shadow); margin-bottom: 9px; }
      .qrow.fresh { animation: pop 1.1s ease; }
      @keyframes pop { 0% { box-shadow: 0 0 0 2px var(--amber-edge), var(--shadow); } 100% { box-shadow: var(--shadow); } }
      .qnum { font-family: var(--font-scripture); font-size: 18px; color: var(--ink-faint); min-width: 18px; }
      .qbody { flex: 1; }
      .qmeta { display: flex; align-items: center; gap: 7px; margin-bottom: 3px; }
      .anchor { font-family: var(--font-mono); font-size: 10px; color: var(--lapis-ink); background: var(--lapis-wash); border-radius: 5px; padding: 1px 6px; }
      .qtype { font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: .08em; color: var(--amber-ink); }
      .qtext { font-size: 13.5px; }
      .need { font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: .06em; color: #8a6a16; background: rgba(185,138,30,0.15); border-radius: 4px; padding: 1px 6px; }
      .ready { font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: .06em; color: var(--lapis-ink); background: var(--lapis-wash); border-radius: 4px; padding: 1px 6px; }
      .reorder { display: flex; flex-direction: column; gap: 2px; color: var(--ink-faint); font-size: 11px; }
      .seed { margin-top: 4px; font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); }
      .newq { width: 100%; border: 1px dashed var(--line); background: transparent; color: var(--ink-soft); border-radius: 9px; padding: 9px; font-size: 12.5px; }
      .newq:hover { border-color: var(--lapis-edge); color: var(--ink); }

      /* right panel */
      .panel { border-left: 1px solid var(--line); background: color-mix(in srgb, var(--desk) 55%, var(--leaf)); overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
      .filters { border-bottom: 1px solid var(--line); padding: 11px 13px; }
      .filters .t { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .16em; color: var(--ink-faint); }
      .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
      .chip { font-family: var(--font-mono); font-size: 10.5px; border: 1px solid var(--line); background: var(--leaf); color: var(--ink-soft); border-radius: 999px; padding: 3px 9px; }
      .chip.on { border-color: var(--lapis-edge); background: var(--lapis-wash); color: var(--lapis-ink); }
      .pbody { overflow-y: auto; padding: 12px 13px; }
      .card { background: var(--leaf); border: 1px solid var(--line); border-left: 3px solid var(--lapis-edge); border-radius: var(--radius); padding: 9px 11px; box-shadow: var(--shadow); margin-bottom: 9px; }
      .card.rubric { border-left-color: var(--rubric-edge); }
      .card.amber { border-left-color: var(--amber-edge); }
      .card.used { opacity: .5; }
      .ctop { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
      .tag { font-family: var(--font-mono); font-size: 8.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-faint); }
      .src { margin-top: 5px; font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); }
      .make { margin-top: 7px; font-family: var(--font-mono); font-size: 10px; border: 1px solid var(--lapis-edge); background: var(--lapis-wash); color: var(--lapis-ink); border-radius: 7px; padding: 3px 8px; }
      .make:hover { background: var(--lapis); color: #fff; }
      :root[data-theme='night'] .make:hover { color: #16181d; }
      .promote { margin-top: 7px; font-family: var(--font-mono); font-size: 10px; border: 1px solid var(--amber-edge); background: var(--amber-wash); color: var(--amber-ink); border-radius: 7px; padding: 3px 8px; }
      .promote:hover { filter: brightness(0.96); }
      .subhead { font-family: var(--font-mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-faint); margin: 4px 2px 8px; }
      .bgbox { border: 1px dashed var(--rubric-edge); background: var(--rubric-wash); border-radius: 9px; padding: 8px 10px; font-size: 12px; color: var(--ink-soft); margin-bottom: 8px; }
      .note { font-size: 11px; color: var(--ink-faint); margin-top: 3px; }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="controls">
        <span class="lbl">Recycle-forward model</span>
        <div class="seg" id="modelSeg">
          <button data-m="convert" class="on">Panel in Build + convert</button>
          <button data-m="pool">v1 candidate pool</button>
          <button data-m="visible">Visible only</button>
        </div>
        <p class="desc" id="desc"></p>
        <button class="toggle" id="themeBtn" title="Day / night">☾</button>
      </div>

      <div class="topbar">
        <span class="brand">Quick&nbsp;to&nbsp;Hear</span>
        <span class="ref">Luke 1:5–25</span>
        <span class="pill">▥ Build lens</span>
        <div class="grow"></div>
        <span class="pill" style="color:var(--ink-faint);background:none;border-color:var(--line)">the running order is what exports</span>
      </div>

      <div class="work">
        <div class="main">
          <div class="maxw">
            <div class="colhead"><span>Running order — what exports</span><span id="qcount"></span></div>
            <div id="order"></div>
            <button class="newq" id="newq" style="display:none">＋ New question (write from scratch)</button>
          </div>
        </div>
        <div class="panel" id="panel"></div>
      </div>
    </div>

    <script>
      const root = document.documentElement;
      document.getElementById('themeBtn').addEventListener('click', () => {
        const n = root.getAttribute('data-theme') === 'night';
        root.setAttribute('data-theme', n ? 'day' : 'night');
        document.getElementById('themeBtn').textContent = n ? '☾' : '☀';
      });

      // prior cards carried from earlier steps
      const PRIOR = [
        { id: 'c1', kind: 'coma', tone: 'lapis', type: 'Observation', anchor: 'Luke 1:8–9', text: 'Ordinary temple duty — faithfulness interrupted by God.', src: '04 · COMA' },
        { id: 'c2', kind: 'coma', tone: 'lapis', type: 'Meaning', anchor: 'Luke 1:13', text: 'The angel names the child and his mission before he is born.', src: '04 · COMA' },
        { id: 'c3', kind: 'note', tone: 'lapis', type: 'Note', anchor: 'Luke 1:13', text: '“Your request has been heard” — cf. ↗ Mal 4:5–6.', src: '03 · Map' },
        { id: 'c4', kind: 'mark', tone: 'rubric', type: 'Mark · unclear', anchor: 'Luke 1:11', text: 'Why does an angel appear here specifically?', src: '03 · Map' },
      ];
      // starting running order (already-written questions)
      let ORDER = [
        { anchor: 'Luke 1:8–10', type: 'Observation', text: 'What is Zechariah doing, and where are the people?', ready: true },
        { anchor: 'Luke 1:13', type: 'Meaning', text: 'Why does the angel say “your prayer has been heard”?', ready: false },
      ];
      const used = new Set();
      let model = 'convert';

      const DESC = {
        convert: '<b>Panel in Build + convert.</b> Build gets the same filtered card panel. Toggle the chips to see prior cards; each COMA answer / note has <b>→ Make a question</b> — it appends a question to the running order at the same anchor, seeded with the text (needs an expected answer). No separate pool.',
        pool: '<b>v1 candidate pool.</b> COMA answers auto-appear as <b>candidates</b>; <b>Promote</b> moves one into the running order (needs an expected answer). Confusion-marks become <b>background boxes</b> (printed, never asked). A dedicated generation surface, separate from the card panel.',
        visible: '<b>Visible only.</b> Prior cards show read-only for reference; no convert button. You write each question from scratch with <b>＋ New question</b>. Simplest, but the most retyping.',
      };

      function orderHTML() {
        return ORDER.map((q, i) => `<div class="qrow ${q.fresh ? 'fresh' : ''}">
          <span class="qnum">${i + 1}</span>
          <div class="qbody">
            <div class="qmeta"><span class="anchor">${q.anchor}</span><span class="qtype">${q.type}</span>${q.ready ? '<span class="ready">ready</span>' : '<span class="need">needs answer</span>'}</div>
            <div class="qtext">${q.text}</div>
            ${q.seed ? `<div class="seed">▸ from ${q.seed}</div>` : ''}
          </div>
          <div class="reorder">▲<br>▼</div>
        </div>`).join('');
      }

      function addQuestion(fromCard) {
        ORDER.push({ anchor: fromCard.anchor, type: fromCard.type.replace(' · unclear', ''), text: fromCard.text, ready: false, fresh: true, seed: fromCard.src });
        used.add(fromCard.id);
        render();
        setTimeout(() => { ORDER.forEach((q) => (q.fresh = false)); }, 1200);
      }

      function panelConvert() {
        const cards = PRIOR.map((c) => `<div class="card ${c.tone} ${used.has(c.id) ? 'used' : ''}">
          <div class="ctop"><span class="anchor">${c.anchor}</span><span class="tag">${c.type}</span></div>
          <div style="font-size:12.5px">${c.text}</div>
          <div class="src">▸ ${c.src}</div>
          ${used.has(c.id) ? '<div class="note">✓ made into a question</div>' : (c.kind === 'mark' ? '<div class="note">marks become background boxes — tell them, don’t ask them</div>' : `<button class="make" data-make="${c.id}">→ Make a question</button>`)}
        </div>`).join('');
        return `<div class="filters"><span class="t">Carried forward — filter by step</span>
          <div class="chips"><button class="chip on">All</button><button class="chip on">Map</button><button class="chip on">COMA</button><button class="chip on">Build</button></div></div>
          <div class="pbody">${cards}</div>`;
      }
      function panelPool() {
        const cands = PRIOR.filter((c) => c.kind === 'coma').map((c) => `<div class="card ${used.has(c.id) ? 'used' : ''}">
          <div class="ctop"><span class="anchor">${c.anchor}</span><span class="tag">${c.type}</span></div>
          <div style="font-size:12.5px">${c.text}</div>
          ${used.has(c.id) ? '<div class="note">✓ promoted</div>' : `<button class="promote" data-make="${c.id}">Promote →</button>`}
        </div>`).join('');
        const boxes = PRIOR.filter((c) => c.kind === 'mark').map((c) => `<div class="bgbox">🛈 ${c.text}<div class="note">background box · ${c.anchor}</div></div>`).join('');
        return `<div class="filters"><span class="t">Recycle pool</span></div>
          <div class="pbody">
            <div class="subhead">Candidates (from COMA)</div>${cands}
            <div class="subhead" style="margin-top:14px">Background boxes (from marks)</div>${boxes}
            <div class="note" style="margin-top:6px">Notes with an @mention would also become support passages here.</div>
          </div>`;
      }
      function panelVisible() {
        const cards = PRIOR.map((c) => `<div class="card ${c.tone}">
          <div class="ctop"><span class="anchor">${c.anchor}</span><span class="tag">${c.type}</span></div>
          <div style="font-size:12.5px">${c.text}</div><div class="src">▸ ${c.src}</div></div>`).join('');
        return `<div class="filters"><span class="t">Carried forward — reference</span></div><div class="pbody">${cards}<div class="note" style="margin-top:6px">Read-only. Write questions on the left.</div></div>`;
      }

      function render() {
        document.getElementById('desc').innerHTML = DESC[model];
        for (const b of document.querySelectorAll('#modelSeg button')) b.classList.toggle('on', b.dataset.m === model);
        document.getElementById('order').innerHTML = orderHTML();
        document.getElementById('qcount').textContent = ORDER.length + ' questions';
        document.getElementById('newq').style.display = model === 'visible' ? '' : 'none';
        const p = document.getElementById('panel');
        p.innerHTML = model === 'convert' ? panelConvert() : model === 'pool' ? panelPool() : panelVisible();
        p.querySelectorAll('[data-make]').forEach((el) => el.addEventListener('click', () => addQuestion(PRIOR.find((c) => c.id === el.dataset.make))));
        p.querySelectorAll('.chip').forEach((el) => el.addEventListener('click', () => el.classList.toggle('on')));
      }
      document.getElementById('newq').addEventListener('click', () => { ORDER.push({ anchor: '—', type: 'Observation', text: '(write your question…)', ready: false, fresh: true }); render(); setTimeout(() => { ORDER.forEach((q) => (q.fresh = false)); }, 1200); });
      document.querySelectorAll('#modelSeg button').forEach((b) => b.addEventListener('click', () => { model = b.dataset.m; render(); }));
      render();
    </script>
  </body>
</html>
